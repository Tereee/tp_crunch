# Configuration commune aux trois variantes. Tout ce qui influe sur la mesure
# est figé ici : seule la taille du cluster doit varier.

spark.master                            spark://spark-master:7077

spark.eventLog.enabled                  true
spark.eventLog.dir                      file:/opt/spark/events
spark.history.fs.logDirectory           file:/opt/spark/events
spark.ui.port                           4040

spark.ui.prometheus.enabled             true
spark.executor.processTreeMetrics.enabled true
spark.metrics.conf                      /opt/spark/conf/metrics.properties
spark.metrics.appStatusSource.enabled   true

# 16 partitions de shuffle : ordre de grandeur des 8 coeurs de la plus grosse
# variante, sans noyer la variante 1 worker sous les tâches vides.
spark.sql.shuffle.partitions            16
# AQE désactivé : il recoalescerait les partitions différemment selon la
# variante et rendrait les trois mesures incomparables.
spark.sql.adaptive.enabled              false

spark.executor.memory                   1800m
spark.driver.memory                     1500m
spark.python.worker.memory              512m

# allocation statique : l'application prend tous les cœurs libres (2, 4, 8)
spark.dynamicAllocation.enabled         false

spark.serializer                        org.apache.spark.serializer.KryoSerializer
spark.local.dir                         /tmp/spark
