# Métriques Spark au format Prometheus via le sink natif de Spark 3.x
# (pas de javaagent JMX à installer). Chaque instance expose sur son UI :
#   master  spark-master:8080/metrics/master/prometheus
#   worker  spark-worker-N:8081/metrics/prometheus
#   driver  spark-master:4040/metrics/prometheus  (pendant un job)
#
# Noms exacts des métriques :
#   curl -s localhost:8080/metrics/master/prometheus | head -40

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
